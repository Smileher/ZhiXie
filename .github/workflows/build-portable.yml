name: 便携包构建

# 只产出两类便携包：Windows x64 与 macOS Apple Silicon。
# 手动触发用产物自取；打 v* 标签时顺带把两个压缩包挂到 Release 上。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: build-portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Windows x64 便携包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建（跳过安装包，只要可执行文件）
        run: pnpm tauri build --target x86_64-pc-windows-msvc --no-bundle

      - name: 组装便携包
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Get-ChildItem -Path "src-tauri\target\x86_64-pc-windows-msvc\release" -Filter *.exe -File |
            ForEach-Object { Copy-Item $_.FullName "portable\$($_.Name)" }
          Copy-Item README.md portable/
          Get-ChildItem portable
          Compress-Archive -Path "portable\*" -DestinationPath "zhixie-windows-x64-portable.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: zhixie-windows-x64-portable
          path: zhixie-windows-x64-portable.zip
          if-no-files-found: error

  macos-arm64:
    name: macOS arm64 便携包
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建（只出 .app，不打 dmg）
        run: pnpm tauri build --target aarch64-apple-darwin --bundles app

      - name: 组装便携包
        run: |
          # 压缩包内直接放 .app，解压即用，不再套一层目录。
          mkdir -p portable
          cp -R src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app portable/
          cp README.md portable/
          ls -la portable
          (cd portable && zip -qry "$GITHUB_WORKSPACE/zhixie-macos-arm64-portable.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: zhixie-macos-arm64-portable
          path: zhixie-macos-arm64-portable.zip
          if-no-files-found: error

  release:
    name: 挂到 Release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - windows-x64
      - macos-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 上传发布附件
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                 --title "$GITHUB_REF_NAME" \
                 --notes "知歇便携包：解压即用，无需安装。Windows x64 需系统自带 WebView2 运行时；macOS 版为 Apple Silicon 构建，首次打开请右键选择「打开」。"
          gh release upload "$GITHUB_REF_NAME" artifacts/*.zip --repo "$GITHUB_REPOSITORY" --clobber
