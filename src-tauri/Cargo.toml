[package]
name = "zhixie"
version = "1.0.0"
description = "一款融合智能体的桌面休息提醒工具"
authors = ["知歇"]
edition = "2021"

[lib]
name = "zhixie_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api 用于弹窗窗口透明（WKWebView 透明背景需私有 API）。
# 应用只走 dmg 直接分发、不上 Mac App Store，可以使用私有 API。
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls-no-alpn", "json"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows-core = "0.61.2"
windows = { version = "=0.61.3", features = ["ApplicationModel"] }
winreg = "0.55"
notify-rust = "4.18"
windows-sys = { version = "0.61", features = ["Win32_Storage_Packaging_Appx", "Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "macos")'.dependencies]
plist = "=1.10.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "unwind"
strip = true
